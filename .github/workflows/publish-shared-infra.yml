name: Publish @chief-strategist-j/shared-infra

on:
  push:
    branches:
      - main
    paths:
      - "shared-infra/**"

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@observability"

      - name: Install dependencies
        run: npm ci
        working-directory: shared-infra

      - name: Typecheck
        run: npm run typecheck
        working-directory: shared-infra

      - name: Build
        run: npm run build
        working-directory: shared-infra

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: shared-infra
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
